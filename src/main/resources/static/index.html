<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<!-- No favicon file. An empty one stops the browser asking the API for /favicon.ico. -->
<link rel="icon" href="data:,">
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; color: #1b1f24; }
  h1 { margin-bottom: 1rem; }
  section { border: 1px solid #d0d7de; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
  h2 { margin: 0 0 0.75rem; font-size: 1.15rem; }
  label { margin-right: 1rem; }
  select { margin-left: 0.25rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #e4e8ec; vertical-align: top; }
  th { font-size: 0.85rem; color: #57606a; }
  .muted { color: #6e7781; font-size: 0.9rem; }
  .desc { color: #57606a; font-size: 0.9rem; }
  .prio-HIGH { font-weight: 600; color: #b42318; }
  .prio-LOW { color: #57606a; }
  .error { background: #fff1f0; border: 1px solid #f5b5b0; border-radius: 4px; padding: 0.5rem 0.75rem; margin-top: 0.75rem; }
  .error p { margin: 0.25rem 0 0; }
  .error ul { margin: 0.25rem 0 0; padding-left: 1.25rem; }
  .pager { margin-top: 0.75rem; display: flex; gap: 1rem; align-items: center; }
</style>
</head>
<body>
<h1>Task Manager</h1>

<section id="tasks">
  <h2>Tasks</h2>
  <div class="filters">
    <label>Status <select id="filter-status"></select></label>
    <label>Priority <select id="filter-priority"></select></label>
    <label>Project <select id="filter-project"></select></label>
  </div>
  <div id="projects-error" class="error" role="alert" hidden></div>
  <div id="list-error" class="error" role="alert" hidden></div>
  <table>
    <thead>
      <tr><th>Task</th><th>Due</th><th>Priority</th><th>Status</th><th>Project</th><th>Version</th></tr>
    </thead>
    <tbody id="task-rows"></tbody>
  </table>
  <div class="pager">
    <button type="button" id="prev-page">Previous</button>
    <span id="page-info" class="muted"></span>
    <button type="button" id="next-page">Next</button>
  </div>
</section>

<script>
'use strict';

// Everything that comes from the API (task titles, project names, error messages) and from the AI is
// untrusted text. It goes into the page with textContent or .value only, never as HTML (ADR-015).

const PAGE_SIZE = 5;
const STATUSES = ['TODO', 'IN_PROGRESS', 'DONE'];
const PRIORITIES = ['LOW', 'MEDIUM', 'HIGH'];
const NO_PROJECT = '—';

const state = {
  page: 0,
  // Each list request gets a number. A slow answer to an old request is dropped, so it cannot
  // overwrite the answer to a newer one (for example after a quick change of filter).
  latestListRequest: 0
};

function byId(id) {
  return document.getElementById(id);
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) {
    node.textContent = text;
  }
  if (className) {
    node.className = className;
  }
  return node;
}

// ---------- talking to the API ----------

// An error from the API, as the ADR-005 body: { status, title, detail, code, fieldErrors }.
// A network failure and an answer that is not an ADR-005 body are turned into the same shape.
class ApiError extends Error {
  constructor(problem) {
    super(problem.title);
    this.problem = problem;
  }
}

function problemOf(status, title, detail) {
  return { status: status, title: title, detail: detail, code: '', fieldErrors: [] };
}

function text(value) {
  return typeof value === 'string' ? value : '';
}

async function readProblem(response) {
  const fallback = problemOf(response.status, 'HTTP ' + response.status + ' ' + response.statusText, '');
  // Tomcat answers some malformed URLs with an HTML page. Only a JSON body is read as ADR-005.
  if (!(response.headers.get('Content-Type') || '').includes('json')) {
    return fallback;
  }
  try {
    const body = await response.json();
    const fieldErrors = Array.isArray(body.fieldErrors) ? body.fieldErrors : [];
    return {
      status: response.status,
      title: text(body.title) || fallback.title,
      detail: text(body.detail),
      code: text(body.code),
      fieldErrors: fieldErrors.map(function (e) {
        return { field: text(e.field), message: text(e.message) };
      })
    };
  } catch (parseError) {
    return fallback;
  }
}

// Returns the parsed JSON (null for 204). Throws ApiError for every failure.
async function api(method, path, body) {
  const options = { method: method, headers: {} };
  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  let response;
  try {
    response = await fetch(path, options);
  } catch (networkError) {
    throw new ApiError(problemOf(0, 'Cannot reach the server',
        'The request got no response. Is the app still running?'));
  }
  if (!response.ok) {
    throw new ApiError(await readProblem(response));
  }
  if (response.status === 204) {
    return null;
  }
  try {
    return await response.json();
  } catch (parseError) {
    throw new ApiError(problemOf(response.status, 'Unreadable response',
        'The server answered ' + response.status + ' but the body is not valid JSON.'));
  }
}

// ---------- showing errors ----------

// Fills an error box from a problem, or hides it for null.
function renderProblem(container, problem) {
  container.replaceChildren();
  container.hidden = problem === null;
  if (problem === null) {
    return;
  }
  container.append(element('strong', problem.title));
  const meta = [problem.status ? 'HTTP ' + problem.status : '', problem.code].filter(Boolean).join(' · ');
  if (meta) {
    container.append(element('span', ' (' + meta + ')', 'muted'));
  }
  if (problem.detail) {
    container.append(element('p', problem.detail));
  }
  if (problem.fieldErrors.length > 0) {
    const list = element('ul');
    for (const fieldError of problem.fieldErrors) {
      list.append(element('li', fieldError.field + ': ' + fieldError.message));
    }
    container.append(list);
  }
}

// Anything that is not an ApiError is a bug in this page. It is shown and logged, not swallowed.
function showError(container, error) {
  if (error instanceof ApiError) {
    renderProblem(container, error.problem);
    return;
  }
  console.error(error);
  renderProblem(container, problemOf(0, 'Unexpected error in the page', String((error && error.message) || error)));
}

// ---------- the task list ----------

function fillSelect(select, options, allLabel) {
  select.replaceChildren();
  const all = element('option', allLabel);
  all.value = '';
  select.append(all);
  for (const option of options) {
    const node = element('option', option.label);
    node.value = option.value;
    select.append(node);
  }
}

function plainOptions(values) {
  return values.map(function (value) { return { value: value, label: value }; });
}

function cell(row, content, className) {
  const td = element('td', undefined, className);
  if (typeof content === 'string') {
    td.textContent = content;
  } else {
    td.append(content);
  }
  row.append(td);
  return td;
}

function taskRow(task) {
  const row = element('tr');
  const title = element('div');
  title.append(element('strong', task.title));
  if (task.description) {
    title.append(element('div', task.description, 'desc'));
  }
  cell(row, title);
  cell(row, task.dueDate);
  // The class comes from a fixed list, never from the response text.
  cell(row, task.priority, PRIORITIES.includes(task.priority) ? 'prio-' + task.priority : '');
  cell(row, task.status);
  if (task.projectName) {
    cell(row, task.projectName);
  } else {
    cell(row, NO_PROJECT, 'muted');
  }
  cell(row, 'v' + task.version, 'muted');
  return row;
}

function clearList() {
  byId('task-rows').replaceChildren();
  byId('page-info').textContent = '';
  byId('prev-page').disabled = true;
  byId('next-page').disabled = true;
}

function renderTasks(page) {
  const rows = byId('task-rows');
  rows.replaceChildren();
  if (page.content.length === 0) {
    const row = element('tr');
    const td = cell(row, 'No tasks match these filters.', 'muted');
    td.colSpan = 6;
    rows.append(row);
  }
  for (const task of page.content) {
    rows.append(taskRow(task));
  }
  state.page = page.page;
  byId('page-info').textContent = page.totalElements === 0
      ? 'No tasks'
      : 'Page ' + (page.page + 1) + ' of ' + page.totalPages + ' · ' + page.totalElements
          + (page.totalElements === 1 ? ' task' : ' tasks');
  byId('prev-page').disabled = page.page === 0;
  byId('next-page').disabled = page.page + 1 >= page.totalPages;
}

async function loadTasks() {
  const request = ++state.latestListRequest;
  const params = new URLSearchParams();
  // An empty value is left out: the API reads a blank filter as "not supplied" anyway (ADR-012).
  for (const [name, id] of [['status', 'filter-status'], ['priority', 'filter-priority'], ['projectId', 'filter-project']]) {
    const value = byId(id).value;
    if (value) {
      params.set(name, value);
    }
  }
  params.set('page', state.page);
  params.set('size', PAGE_SIZE);
  try {
    const page = await api('GET', '/tasks?' + params);
    if (request !== state.latestListRequest) {
      return;
    }
    renderProblem(byId('list-error'), null);
    renderTasks(page);
  } catch (error) {
    if (request !== state.latestListRequest) {
      return;
    }
    clearList();
    showError(byId('list-error'), error);
  }
}

async function loadProjects() {
  try {
    const projects = await api('GET', '/projects');
    renderProblem(byId('projects-error'), null);
    fillSelect(byId('filter-project'), projects.map(function (project) {
      return { value: String(project.id), label: project.name };
    }), 'All');
  } catch (error) {
    showError(byId('projects-error'), error);
  }
}

// ---------- start ----------

function changeFilter() {
  state.page = 0;
  loadTasks();
}

fillSelect(byId('filter-status'), plainOptions(STATUSES), 'All');
fillSelect(byId('filter-priority'), plainOptions(PRIORITIES), 'All');
fillSelect(byId('filter-project'), [], 'All');
for (const id of ['filter-status', 'filter-priority', 'filter-project']) {
  byId(id).addEventListener('change', changeFilter);
}
byId('prev-page').addEventListener('click', function () {
  state.page = Math.max(0, state.page - 1);
  loadTasks();
});
byId('next-page').addEventListener('click', function () {
  state.page = state.page + 1;
  loadTasks();
});

clearList();
loadProjects();
loadTasks();
</script>
</body>
</html>
