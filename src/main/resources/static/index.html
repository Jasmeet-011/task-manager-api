<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<!-- No favicon file. An empty one stops the browser asking the API for /favicon.ico. -->
<link rel="icon" href="data:,">
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; color: #1b1f24; }
  h1 { margin-bottom: 1rem; }
  section { border: 1px solid #d0d7de; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
  h2 { margin: 0 0 0.75rem; font-size: 1.15rem; }
  label { margin-right: 1rem; }
  select { margin-left: 0.25rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #e4e8ec; vertical-align: top; }
  th { font-size: 0.85rem; color: #57606a; }
  .muted { color: #6e7781; font-size: 0.9rem; }
  .desc { color: #57606a; font-size: 0.9rem; }
  .prio-HIGH { font-weight: 600; color: #b42318; }
  .prio-LOW { color: #57606a; }
  .error { background: #fff1f0; border: 1px solid #f5b5b0; border-radius: 4px; padding: 0.5rem 0.75rem; margin-top: 0.75rem; }
  .error p { margin: 0.25rem 0 0; }
  .error ul { margin: 0.25rem 0 0; padding-left: 1.25rem; }
  .pager { margin-top: 0.75rem; display: flex; gap: 1rem; align-items: center; }
  .ok { background: #dafbe1; border: 1px solid #7ee2a0; border-radius: 4px; padding: 0.5rem 0.75rem; margin-top: 0.75rem; }
  .field { margin-bottom: 0.75rem; }
  .field label { display: block; margin: 0 0 0.2rem; font-size: 0.9rem; }
  .field input[type="text"], .field textarea { width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 1rem; }
  .field-error { color: #b42318; font-size: 0.9rem; margin-top: 0.2rem; }
  .invalid { border: 2px solid #cf222e; }
  /* A field the model left empty: the user has to fill it in before creating the task. */
  .needs-input { background: #fff8c5; border: 2px solid #d4a72c; }
  .suggest { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #e4e8ec; }
</style>
</head>
<body>
<h1>Task Manager</h1>

<section id="tasks">
  <h2>Tasks</h2>
  <div class="filters">
    <label>Status <select id="filter-status"></select></label>
    <label>Priority <select id="filter-priority"></select></label>
    <label>Project <select id="filter-project"></select></label>
  </div>
  <div id="projects-error" class="error" role="alert" hidden></div>
  <div id="list-ok" class="ok" role="status" hidden></div>
  <!-- Errors of a status change. Separate from list-error, because reloading the list after a 409
       would hide a message that shared its box. -->
  <div id="action-error" class="error" role="alert" hidden></div>
  <div id="list-error" class="error" role="alert" hidden></div>
  <table>
    <thead>
      <tr><th>Task</th><th>Due</th><th>Priority</th><th>Status</th><th>Project</th><th>Version</th></tr>
    </thead>
    <tbody id="task-rows"></tbody>
  </table>
  <div class="pager">
    <button type="button" id="prev-page">Previous</button>
    <span id="page-info" class="muted"></span>
    <button type="button" id="next-page">Next</button>
  </div>
  <p class="muted">To see a version conflict: open this page in two tabs, change a task's status in one,
    then change the same task in the other tab, whose list is now out of date.</p>
</section>

<section id="new-task">
  <h2>New task</h2>

  <div class="suggest">
    <div class="field">
      <label for="suggest-text">Suggest from a note (the AI fills the form below, you check it and create the task)</label>
      <textarea id="suggest-text" rows="2" placeholder="For example: urgent, send the report by Friday"></textarea>
    </div>
    <button type="button" id="suggest-button">Suggest</button>
    <p id="suggest-note" class="muted" hidden></p>
    <div id="suggest-error" class="error" role="alert" hidden></div>
  </div>

  <!-- novalidate and no required or maxlength: the API is the one place that validates, so its
       field errors are what the user sees. -->
  <form id="create-form" novalidate>
    <div class="field">
      <label for="field-title">Title</label>
      <input type="text" id="field-title">
      <div id="error-title" class="field-error" hidden></div>
    </div>
    <div class="field">
      <label for="field-description">Description (optional)</label>
      <textarea id="field-description" rows="2"></textarea>
      <div id="error-description" class="field-error" hidden></div>
    </div>
    <div class="row">
      <div class="field">
        <label for="field-dueDate">Due date</label>
        <input type="date" id="field-dueDate">
        <div id="error-dueDate" class="field-error" hidden></div>
      </div>
      <div class="field">
        <label for="field-priority">Priority</label>
        <select id="field-priority"></select>
        <div id="error-priority" class="field-error" hidden></div>
      </div>
    </div>
    <button type="submit" id="create-button">Create task</button>
    <div id="create-ok" class="ok" role="status" hidden></div>
    <div id="create-error" class="error" role="alert" hidden></div>
  </form>
</section>

<script>
'use strict';

// Everything that comes from the API (task titles, project names, error messages) and from the AI is
// untrusted text. It goes into the page with textContent or .value only, never as HTML (ADR-015).

const PAGE_SIZE = 5;
const STATUSES = ['TODO', 'IN_PROGRESS', 'DONE'];
const PRIORITIES = ['LOW', 'MEDIUM', 'HIGH'];
const NO_PROJECT = '—';

const state = {
  page: 0,
  // Each list request gets a number. A slow answer to an old request is dropped, so it cannot
  // overwrite the answer to a newer one (for example after a quick change of filter).
  latestListRequest: 0
};

function byId(id) {
  return document.getElementById(id);
}

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) {
    node.textContent = text;
  }
  if (className) {
    node.className = className;
  }
  return node;
}

// ---------- talking to the API ----------

// An error from the API, as the ADR-005 body: { status, title, detail, code, fieldErrors }.
// A network failure and an answer that is not an ADR-005 body are turned into the same shape.
class ApiError extends Error {
  constructor(problem) {
    super(problem.title);
    this.problem = problem;
  }
}

function problemOf(status, title, detail) {
  return { status: status, title: title, detail: detail, code: '', fieldErrors: [] };
}

function text(value) {
  return typeof value === 'string' ? value : '';
}

async function readProblem(response) {
  const fallback = problemOf(response.status, 'HTTP ' + response.status + ' ' + response.statusText, '');
  // Tomcat answers some malformed URLs with an HTML page. Only a JSON body is read as ADR-005.
  if (!(response.headers.get('Content-Type') || '').includes('json')) {
    return fallback;
  }
  try {
    const body = await response.json();
    const fieldErrors = Array.isArray(body.fieldErrors) ? body.fieldErrors : [];
    return {
      status: response.status,
      title: text(body.title) || fallback.title,
      detail: text(body.detail),
      code: text(body.code),
      fieldErrors: fieldErrors.map(function (e) {
        return { field: text(e.field), message: text(e.message) };
      })
    };
  } catch (parseError) {
    return fallback;
  }
}

// Returns the parsed JSON (null for 204). Throws ApiError for every failure.
async function api(method, path, body) {
  const options = { method: method, headers: {} };
  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  let response;
  try {
    response = await fetch(path, options);
  } catch (networkError) {
    throw new ApiError(problemOf(0, 'Cannot reach the server',
        'The request got no response. Is the app still running?'));
  }
  if (!response.ok) {
    throw new ApiError(await readProblem(response));
  }
  if (response.status === 204) {
    return null;
  }
  try {
    return await response.json();
  } catch (parseError) {
    throw new ApiError(problemOf(response.status, 'Unreadable response',
        'The server answered ' + response.status + ' but the body is not valid JSON.'));
  }
}

// ---------- showing errors ----------

// Fills an error box from a problem, or hides it for null.
function renderProblem(container, problem) {
  container.replaceChildren();
  container.hidden = problem === null;
  if (problem === null) {
    return;
  }
  container.append(element('strong', problem.title));
  const meta = [problem.status ? 'HTTP ' + problem.status : '', problem.code].filter(Boolean).join(' · ');
  if (meta) {
    container.append(element('span', ' (' + meta + ')', 'muted'));
  }
  if (problem.detail) {
    container.append(element('p', problem.detail));
  }
  if (problem.fieldErrors.length > 0) {
    const list = element('ul');
    for (const fieldError of problem.fieldErrors) {
      list.append(element('li', fieldError.field + ': ' + fieldError.message));
    }
    container.append(list);
  }
}

// Anything that is not an ApiError is a bug in this page. It is shown and logged, not swallowed.
function showError(container, error) {
  if (error instanceof ApiError) {
    renderProblem(container, error.problem);
    return;
  }
  console.error(error);
  renderProblem(container, problemOf(0, 'Unexpected error in the page', String((error && error.message) || error)));
}

// ---------- the task list ----------

function fillSelect(select, options, allLabel) {
  select.replaceChildren();
  const all = element('option', allLabel);
  all.value = '';
  select.append(all);
  for (const option of options) {
    const node = element('option', option.label);
    node.value = option.value;
    select.append(node);
  }
}

function plainOptions(values) {
  return values.map(function (value) { return { value: value, label: value }; });
}

function cell(row, content, className) {
  const td = element('td', undefined, className);
  if (typeof content === 'string') {
    td.textContent = content;
  } else {
    td.append(content);
  }
  row.append(td);
  return td;
}

// The only edit the page offers: change a task's status.
function statusSelect(task) {
  const select = element('select');
  for (const status of STATUSES) {
    const option = element('option', status);
    option.value = status;
    select.append(option);
  }
  select.value = task.status;
  // An attribute is set as text, never parsed as HTML, so a task title in it is safe.
  select.setAttribute('aria-label', 'Status of ' + task.title);
  select.addEventListener('change', function () {
    changeStatus(task, select);
  });
  return select;
}

function taskRow(task) {
  const row = element('tr');
  const title = element('div');
  title.append(element('strong', task.title));
  if (task.description) {
    title.append(element('div', task.description, 'desc'));
  }
  cell(row, title);
  cell(row, task.dueDate);
  // The class comes from a fixed list, never from the response text.
  cell(row, task.priority, PRIORITIES.includes(task.priority) ? 'prio-' + task.priority : '');
  cell(row, statusSelect(task));
  if (task.projectName) {
    cell(row, task.projectName);
  } else {
    cell(row, NO_PROJECT, 'muted');
  }
  cell(row, 'v' + task.version, 'muted');
  return row;
}

function clearList() {
  byId('task-rows').replaceChildren();
  byId('page-info').textContent = '';
  byId('prev-page').disabled = true;
  byId('next-page').disabled = true;
}

function renderTasks(page) {
  const rows = byId('task-rows');
  rows.replaceChildren();
  if (page.content.length === 0) {
    const row = element('tr');
    const td = cell(row, 'No tasks match these filters.', 'muted');
    td.colSpan = 6;
    rows.append(row);
  }
  for (const task of page.content) {
    rows.append(taskRow(task));
  }
  state.page = page.page;
  byId('page-info').textContent = page.totalElements === 0
      ? 'No tasks'
      : 'Page ' + (page.page + 1) + ' of ' + page.totalPages + ' · ' + page.totalElements
          + (page.totalElements === 1 ? ' task' : ' tasks');
  byId('prev-page').disabled = page.page === 0;
  byId('next-page').disabled = page.page + 1 >= page.totalPages;
}

async function loadTasks() {
  const request = ++state.latestListRequest;
  const params = new URLSearchParams();
  // An empty value is left out: the API reads a blank filter as "not supplied" anyway (ADR-012).
  for (const [name, id] of [['status', 'filter-status'], ['priority', 'filter-priority'], ['projectId', 'filter-project']]) {
    const value = byId(id).value;
    if (value) {
      params.set(name, value);
    }
  }
  params.set('page', state.page);
  params.set('size', PAGE_SIZE);
  try {
    const page = await api('GET', '/tasks?' + params);
    if (request !== state.latestListRequest) {
      return;
    }
    renderProblem(byId('list-error'), null);
    renderTasks(page);
  } catch (error) {
    if (request !== state.latestListRequest) {
      return;
    }
    clearList();
    showError(byId('list-error'), error);
  }
}

async function loadProjects() {
  try {
    const projects = await api('GET', '/projects');
    renderProblem(byId('projects-error'), null);
    fillSelect(byId('filter-project'), projects.map(function (project) {
      return { value: String(project.id), label: project.name };
    }), 'All');
  } catch (error) {
    showError(byId('projects-error'), error);
  }
}

// ---------- one result at a time ----------

// The page shows the result of the latest action only. Every action (filter, paging, suggest, create,
// status change) starts by hiding the results of the earlier ones, so an old success never sits next
// to a new error. A result stays until the next action starts: there is no timer.
// The yellow marks and the suggest note describe the state of the form, not a result, so they stay.
function clearResults() {
  clearCreateMessages();
  byId('list-ok').hidden = true;
  for (const id of ['suggest-error', 'action-error', 'list-error']) {
    renderProblem(byId(id), null);
  }
}

// ---------- changing a status ----------

async function changeStatus(task, select) {
  clearResults();
  select.disabled = true;  // one request at a time for this row
  try {
    // PUT replaces the whole task (ADR-010), so every field is sent, not only the status. The version
    // is the one from the last load. If someone changed the task since, the API answers 409 (ADR-014).
    const updated = await api('PUT', '/tasks/' + task.id, {
      title: task.title,
      description: task.description,
      dueDate: task.dueDate,
      priority: task.priority,
      status: select.value,
      version: task.version
    });
    byId('list-ok').textContent = 'Task #' + updated.id + ' is now ' + updated.status + '.';
    byId('list-ok').hidden = false;
    await loadTasks();
  } catch (error) {
    select.value = task.status;  // the change did not happen, so show the status the task still has
    if (error instanceof ApiError && error.problem.status === 409 && error.problem.code === 'VERSION_CONFLICT') {
      renderProblem(byId('action-error'), {
        status: 409,
        title: 'This task was changed elsewhere',
        detail: 'The list has been reloaded with the current data. Make the change again if you still want it.',
        code: error.problem.code,
        fieldErrors: []
      });
      await loadTasks();  // the user sees the current data, and the current version for the next try
    } else {
      showError(byId('action-error'), error);
      if (error instanceof ApiError && error.problem.status === 404) {
        await loadTasks();  // the task is gone, so the list should not show it
      }
    }
  } finally {
    select.disabled = false;
  }
}

// ---------- the create form ----------

// The form fields have the same names as the fields of POST /tasks, so a field error from the API
// ("dueDate: must not be null") goes straight to the input with that name.
const FORM_FIELDS = ['title', 'description', 'dueDate', 'priority'];

function input(name) {
  return byId('field-' + name);
}

function setFieldError(name, message) {
  const box = byId('error-' + name);
  box.textContent = message;
  box.hidden = message === '';
  input(name).classList.toggle('invalid', message !== '');
}

// Hides the messages of the last create attempt. The yellow "fill this in" marks are not touched.
function clearCreateMessages() {
  for (const name of FORM_FIELDS) {
    setFieldError(name, '');
  }
  byId('create-ok').hidden = true;
  renderProblem(byId('create-error'), null);
}

function formBody() {
  // The title is sent as typed. An empty date, priority or description is sent as null, so a missing
  // required field gets the API's own 400 and not a made-up message.
  return {
    title: input('title').value,
    description: input('description').value || null,
    dueDate: input('dueDate').value || null,
    priority: input('priority').value || null
  };
}

function showCreateError(error) {
  if (!(error instanceof ApiError)) {
    showError(byId('create-error'), error);
    return;
  }
  const problem = error.problem;
  const messages = {};
  const unmatched = [];
  for (const fieldError of problem.fieldErrors) {
    if (FORM_FIELDS.includes(fieldError.field)) {
      (messages[fieldError.field] = messages[fieldError.field] || []).push(fieldError.message);
    } else {
      unmatched.push(fieldError);
    }
  }
  for (const name of Object.keys(messages)) {
    setFieldError(name, messages[name].join(', '));
  }
  // The box keeps the title and detail, and lists only the field errors that have no input.
  renderProblem(byId('create-error'), {
    status: problem.status, title: problem.title, detail: problem.detail, code: problem.code, fieldErrors: unmatched
  });
}

function anyFilterActive() {
  return ['filter-status', 'filter-priority', 'filter-project'].some(function (id) {
    return byId(id).value !== '';
  });
}

async function createTask(event) {
  event.preventDefault();
  const button = byId('create-button');
  clearResults();
  button.disabled = true;  // a second click while the request runs would create a second task
  try {
    const task = await api('POST', '/tasks', formBody());
    byId('create-form').reset();
    for (const name of FORM_FIELDS) {
      input(name).classList.remove('needs-input');
    }
    byId('suggest-note').hidden = true;
    byId('create-ok').textContent = 'Created task #' + task.id + ': ' + task.title
        + (anyFilterActive() ? ' (it is not shown below if a filter excludes it)' : '');
    byId('create-ok').hidden = false;
    state.page = 0;
    await loadTasks();
  } catch (error) {
    showCreateError(error);
  } finally {
    button.disabled = false;
  }
}

// ---------- AI suggestion ----------

// The draft fills the form and nothing is saved. A field the model left null stays empty and is marked,
// so the user fills it in. Only dueDate and priority are marked: the API requires them to create a
// task, while a missing description is fine (ADR-003, ADR-013).
function fillFormFromDraft(draft) {
  clearCreateMessages();
  const values = {
    title: text(draft.title),
    description: text(draft.description),
    dueDate: text(draft.dueDate),
    priority: text(draft.priority)
  };
  for (const name of FORM_FIELDS) {
    input(name).value = values[name];
    input(name).classList.remove('needs-input');
  }
  const missing = [];
  for (const name of ['dueDate', 'priority']) {
    if (values[name] === '') {
      input(name).classList.add('needs-input');
      missing.push(name === 'dueDate' ? 'due date' : 'priority');
    }
  }
  const note = byId('suggest-note');
  note.textContent = missing.length === 0
      ? 'Draft filled in below. Check it, then click Create task.'
      : 'Draft filled in below. Your note did not say the ' + missing.join(' or ')
          + ': fill in the highlighted field' + (missing.length === 1 ? '' : 's') + ', then click Create task.';
  note.hidden = false;
}

async function suggest() {
  const button = byId('suggest-button');
  clearResults();
  byId('suggest-note').hidden = true;
  button.disabled = true;
  button.textContent = 'Suggesting...';  // the call can take several seconds
  try {
    fillFormFromDraft(await api('POST', '/tasks/suggest', { text: byId('suggest-text').value }));
  } catch (error) {
    showError(byId('suggest-error'), error);
  } finally {
    button.disabled = false;
    button.textContent = 'Suggest';
  }
}

// ---------- start ----------

function changeFilter() {
  clearResults();
  state.page = 0;
  loadTasks();
}

fillSelect(byId('filter-status'), plainOptions(STATUSES), 'All');
fillSelect(byId('filter-priority'), plainOptions(PRIORITIES), 'All');
fillSelect(byId('filter-project'), [], 'All');
for (const id of ['filter-status', 'filter-priority', 'filter-project']) {
  byId(id).addEventListener('change', changeFilter);
}
byId('prev-page').addEventListener('click', function () {
  clearResults();
  state.page = Math.max(0, state.page - 1);
  loadTasks();
});
byId('next-page').addEventListener('click', function () {
  clearResults();
  state.page = state.page + 1;
  loadTasks();
});

fillSelect(input('priority'), plainOptions(PRIORITIES), '(choose)');
for (const name of FORM_FIELDS) {
  // Editing a marked or rejected field removes its mark.
  for (const type of ['input', 'change']) {
    input(name).addEventListener(type, function () {
      input(name).classList.remove('needs-input');
      setFieldError(name, '');
    });
  }
}
byId('create-form').addEventListener('submit', createTask);
byId('suggest-button').addEventListener('click', suggest);

clearList();
loadProjects();
loadTasks();
</script>
</body>
</html>
