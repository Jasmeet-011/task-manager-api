spring.application.name=TaskManager

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

# Jackson 3 maps a JSON number to an enum by position by default ("priority": 1 became MEDIUM).
# Reject it, so it becomes a 400 VALIDATION_FAILED naming the field.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Never include stack traces or exception messages in container-level error responses
server.error.include-stacktrace=never
server.error.include-message=never

# H2 console for demos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo data for the UI (ADR-015). It fills an empty database on every start, and disappears when the app
# stops (H2 is in memory). Set it to false to start empty. Tests set it to false in
# src/test/resources/config/application.properties.
app.seed-demo-data=true

# AI suggestions (ADR-004, ADR-013). The key comes only from the environment and is never committed.
# With no key the app still starts, and POST /tasks/suggest returns 503 AI_NOT_CONFIGURED.
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
# Extracting four fields from a short note does not need a larger model. Every current model
# works here without code changes, because the request does not force the tool call.
ai.anthropic.model=claude-haiku-5-5
ai.anthropic.base-url=https://api.anthropic.com
# A ceiling for a stuck call, not the expected time. Either timeout returns 504 AI_TIMEOUT.
ai.anthropic.connect-timeout=5s
ai.anthropic.read-timeout=20s
