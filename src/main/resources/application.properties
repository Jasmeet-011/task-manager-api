spring.application.name=TaskManager

# H2 in-memory
spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

# Jackson 3 maps a JSON number to an enum by position by default ("priority": 1 became MEDIUM).
# Reject it, so it becomes a 400 VALIDATION_FAILED naming the field.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Never include stack traces or exception messages in container-level error responses
server.error.include-stacktrace=never
server.error.include-message=never

# H2 console for demos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
