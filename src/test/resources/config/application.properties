# Test-only overrides (ADR-015). Spring Boot loads this IN ADDITION to the main application.properties
# (classpath:/config/ is a second location, and it wins for the keys it sets). The main file is NOT
# replaced, so keep this file to the few keys a test must change. Never name a test file
# src/test/resources/application.properties: that one has the same path as the main file and shadows it.
# SeedDisabledInTestsTest checks that the main settings are still in effect.
app.seed-demo-data=false
